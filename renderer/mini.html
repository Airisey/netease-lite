<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' neimg: data: blob:; media-src 'self' https: http: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' neimg:">
<title>网易云音乐 Lite · 悬浮窗</title>
<!-- boot.js 必须在样式表之前跑：它把 ne.bootSkin 写到 <html data-skin> -->
<script src="js/boot.js"></script>
<!-- styles.css：只为拿到 :root 的深色默认值和 button / [hidden] / .lyric-line 的
     基础重置 —— 歌词行由 Lrc.LyricView 生成，它用的正是 .lyric-line 这套类名。
     皮肤不在这里加载：小窗自带一份 light 变量覆盖，见 mini.css 顶部。 -->
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mini.css">
</head>
<body data-mode="v">

<div class="mini-card" id="miniCard">

  <!-- ==================== 头部（拖拽区） ====================
       竖版：整块头部都是拖拽区（封面 + 歌曲信息 + 右上角关闭）
       横版：只有封面 + 标题这一条是拖拽区，按钮和进度线不在里面 -->
  <header class="mini-head mini-drag" id="miniHead">
    <div class="mini-cover" id="miniCover">
      <img id="miniCoverImg" alt="">
      <div class="mini-cover-fallback">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3v10.6A4 4 0 1014 17V7h4V3z"/></svg>
      </div>
    </div>

    <div class="mini-meta">
      <div class="mini-title" id="miniTitle">未在播放</div>
      <div class="mini-artist" id="miniArtist"><span class="mini-muted">—</span></div>
      <a class="mini-album" id="miniAlbum"></a>
    </div>

    <button class="mini-close" id="miniClose" title="收起悬浮窗" aria-label="收起悬浮窗">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
    </button>
  </header>

  <!-- ==================== 歌词（仅竖版） ==================== -->
  <section class="mini-lyric" id="miniLyric">
    <div class="mini-lyric-scroll" id="miniLyricScroll">
      <div class="mini-lyric-list" id="miniLyricList"></div>
    </div>
    <div class="mini-lyric-empty" id="miniLyricEmpty" hidden>未在播放</div>
  </section>

  <!-- ==================== 进度 + 按钮 ==================== -->
  <div class="mini-bottom" id="miniBottom">

    <div class="mini-progress-row" id="miniProgressRow">
      <span class="mini-time" id="miniCur">00:00</span>
      <div class="mini-progress" id="miniProgress" title="拖动调整进度">
        <div class="mini-progress-bg"></div>
        <div class="mini-progress-fill" id="miniProgressFill"></div>
        <div class="mini-progress-knob" id="miniProgressKnob"></div>
      </div>
      <span class="mini-time" id="miniDur">00:00</span>
    </div>

    <div class="mini-controls" id="miniControls">
      <!-- 1. 循环 / 单曲 / 随机 三合一 -->
      <button class="mini-btn" id="miniRepeat" title="列表循环">
        <svg id="miniIconRepeatList" viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        <svg id="miniIconRepeatOne" viewBox="0 0 24 24" width="17" height="17" hidden><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/><text x="12" y="15.5" font-size="8" font-weight="700" text-anchor="middle" fill="currentColor">1</text></svg>
        <svg id="miniIconShuffle" viewBox="0 0 24 24" width="17" height="17" hidden><path fill="currentColor" d="M17 3l4 4-4 4V8h-2.2l-2.3 3-1.3-1.7L13.4 6H17V3zM3 6h4.3l2.5 3.3-1.3 1.7L6.6 8H3V6zm14 8v-3l4 4-4 4v-3h-3.6l-2.2-3 1.3-1.7L14.8 14H17zM3 16h3.6l2.2-3 1.3 1.7-2.5 3.3H3v-2z"/></svg>
      </button>

      <!-- 2. 上一首 -->
      <button class="mini-btn" id="miniPrev" title="上一首">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 6h2v12H7zm3 6l9-6v12z"/></svg>
      </button>

      <!-- 3. 播放 / 暂停 -->
      <button class="mini-btn mini-play" id="miniPlay" title="播放">
        <svg id="miniIconPlay" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7 4l13 8-13 8z"/></svg>
        <svg id="miniIconPause" viewBox="0 0 24 24" width="20" height="20" hidden><path fill="currentColor" d="M7 4h4v16H7zm6 0h4v16h-4z"/></svg>
      </button>

      <!-- 4. 下一首 -->
      <button class="mini-btn" id="miniNext" title="下一首">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15 6h2v12h-2zM5 18V6l9 6z"/></svg>
      </button>

      <!-- 5. 喜欢 -->
      <button class="mini-btn mini-like" id="miniLike" title="喜欢">
        <svg id="miniIconHeart" viewBox="0 0 24 24" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M12 19.8S5.2 15.2 5.2 10.4A3.9 3.9 0 0112 7.9a3.9 3.9 0 016.8 2.5c0 4.8-6.8 9.4-6.8 9.4z"/></svg>
        <svg id="miniIconHeartOn" viewBox="0 0 24 24" width="17" height="17" hidden><path fill="currentColor" d="M12 21s-8-5.1-8-11a4.6 4.6 0 018-3.1A4.6 4.6 0 0120 10c0 5.9-8 11-8 11z"/></svg>
      </button>

      <!-- 6. 播放队列（仅竖版） -->
      <button class="mini-btn" id="miniQueueBtn" title="播放队列">
        <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm12 0v-5l6 3z"/></svg>
      </button>
    </div>
  </div>

  <!-- ==================== 队列浮层（仅竖版） ==================== -->
  <div class="mini-queue" id="miniQueue" hidden>
    <div class="mini-queue-head">
      <span>播放队列 <em id="miniQueueCount">0</em></span>
      <button class="mini-queue-x" id="miniQueueClose" title="关闭队列" aria-label="关闭队列">
        <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M19 6.4L17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg>
      </button>
    </div>
    <div class="mini-queue-list" id="miniQueueList"></div>
  </div>

</div>

<script src="js/util.js"></script>
<script src="js/lrc.js"></script>
<script src="js/mini.js"></script>
</body>
</html>
